<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clock out</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.30.0/lib/msal-browser.min.js"></script>
  <style>
    :root { --ink:#1f1f1f; --muted:#5f5f5f; --line:#d6d6d6; --accent:#5b3fd4; --accent-ink:#ffffff; --warn:#a4262c; --ok:#0f7b3f; --bg:#ffffff; --panel:#f6f5fb; }
    @media (prefers-color-scheme: dark) {
      :root { --ink:#f0f0f0; --muted:#b5b5b5; --line:#4a4a4a; --accent:#8f7cf0; --accent-ink:#141414; --warn:#ff8a8f; --ok:#5fd18f; --bg:#1f1f1f; --panel:#2a2833; }
    }
    * { box-sizing: border-box; }
    body { margin:0; padding:16px; font: 14px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; color:var(--ink); background:var(--bg); }
    h1 { font-size:13px; letter-spacing:.04em; color:var(--muted); margin:0 0 12px; font-weight:600; }
    .task { font-size:16px; font-weight:600; margin:0 0 4px; word-break:break-word; }
    .sub { color:var(--muted); margin:0 0 14px; font-size:13px; }
    label { display:block; font-size:13px; font-weight:600; margin:0 0 6px; }
    textarea { width:100%; min-height:80px; padding:8px; border:1px solid var(--line); border-radius:6px; font:inherit; color:var(--ink); background:var(--bg); resize:vertical; }
    button { width:100%; padding:12px; border:0; border-radius:6px; font-size:15px; font-weight:600; cursor:pointer; margin:12px 0 8px; background:var(--accent); color:var(--accent-ink); }
    button:disabled { opacity:.5; cursor:default; }
    .msg { font-size:13px; margin:8px 0 0; }
    .msg.err { color:var(--warn); }
    .msg.ok { color:var(--ok); }
    .note { font-size:12px; color:var(--muted); margin:12px 0 0; }
  </style>
</head>
<body>
  <h1>Clock out</h1>
  <p class="task" id="taskTitle">Loading…</p>
  <p class="sub" id="taskSub"></p>
  <div id="form" hidden>
    <label for="note">Note for the task chat (optional)</label>
    <textarea id="note" placeholder="Where you left off, or anything to remember"></textarea>
    <button id="outBtn">Clock out</button>
  </div>
  <p class="msg" id="msg"></p>
  <p class="note">Clocking out opens a filled-in calendar entry for the time you worked. Click <strong>Save</strong> on it. A note, if you type one, is posted to the task's chat under your name.</p>
  <script src="auth.js"></script>
  <script src="clockout.js"></script>
</body>
</html>
